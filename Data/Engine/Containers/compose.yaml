name: ${BOREALIS_COMPOSE_PROJECT_NAME:-borealis-engine}

x-borealis-hardened-service: &borealis-hardened-service
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

services:
  docker-proxy:
    <<: *borealis-hardened-service
    image: ${BOREALIS_DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.4.2}
    container_name: borealis-engine-docker-proxy
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    group_add:
      - "${BOREALIS_DOCKER_SOCKET_GID:-0}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_DOCKER_PROXY_MEMORY_LIMIT:-128m}
    cpus: "${BOREALIS_DOCKER_PROXY_CPU_LIMIT:-0.50}"
    pids_limit: ${BOREALIS_DOCKER_PROXY_PIDS_LIMIT:-64}
    environment:
      CONTAINERS: "1"
      POST: "0"
      LOG_LEVEL: warning
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - ${BOREALIS_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro

  api-backend:
    <<: *borealis-hardened-service
    image: ${BOREALIS_API_BACKEND_IMAGE:-borealis-engine/api-backend:local}
    container_name: borealis-engine-api-backend
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_API_BACKEND_MEMORY_LIMIT:-512m}
    cpus: "${BOREALIS_API_BACKEND_CPU_LIMIT:-1.50}"
    pids_limit: ${BOREALIS_API_BACKEND_PIDS_LIMIT:-160}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    environment:
      BOREALIS_SCHEDULED_JOBS_START_LOOP: "0"
      HOME: /tmp
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/api-backend:/opt/Borealis/Engine/Services/api-backend
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge/config:/opt/Borealis/Engine/Services/traefik-edge/config
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge/env:/opt/Borealis/Engine/Services/traefik-edge/env
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge/logs:/opt/Borealis/Engine/Services/traefik-edge/logs
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge/state:/opt/Borealis/Engine/Services/traefik-edge/state
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/config:/opt/Borealis/Engine/Services/wireguard-tunnel/config
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/run:/opt/Borealis/Engine/Services/wireguard-tunnel/run
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/secrets:/opt/Borealis/Engine/Services/wireguard-tunnel/secrets
    depends_on:
      docker-proxy:
        condition: service_started
      postgres-db:
        condition: service_healthy
      wireguard-tunnel:
        condition: service_healthy
      remote-desktop-guacd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "borealis-api-backend-go", "api-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  job-scheduler:
    <<: *borealis-hardened-service
    image: ${BOREALIS_JOB_SCHEDULER_IMAGE:-borealis-engine/job-scheduler:local}
    container_name: borealis-engine-job-scheduler
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_JOB_SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: "${BOREALIS_JOB_SCHEDULER_CPU_LIMIT:-1.00}"
    pids_limit: ${BOREALIS_JOB_SCHEDULER_PIDS_LIMIT:-160}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    environment:
      BOREALIS_INTERNAL_API_BASE_URL: ${BOREALIS_INTERNAL_API_BASE_URL:-http://127.0.0.1:5000}
      BOREALIS_SITE_WORKER_IMAGE: ${BOREALIS_SITE_WORKER_IMAGE:-borealis-engine/site-worker:local}
      BOREALIS_SITE_WORKER_ORCHESTRATOR_SOCKET: ${BOREALIS_SITE_WORKER_ORCHESTRATOR_SOCKET:-/opt/Borealis/Engine/Services/site-worker-orchestrator/run/orchestrator.sock}
      BOREALIS_JOB_SCHEDULER_GUID: job-scheduler
      BOREALIS_JOB_SCHEDULER_CONTAINER_NAME: borealis-engine-job-scheduler
      HOME: /tmp
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Deploy:/opt/Borealis/Engine/Deploy:ro
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/api-backend:/opt/Borealis/Engine/Services/api-backend
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/site-worker-orchestrator/run:/opt/Borealis/Engine/Services/site-worker-orchestrator/run
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge/config:/opt/Borealis/Engine/Services/traefik-edge/config
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/config:/opt/Borealis/Engine/Services/wireguard-tunnel/config
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/run:/opt/Borealis/Engine/Services/wireguard-tunnel/run
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel/secrets:/opt/Borealis/Engine/Services/wireguard-tunnel/secrets
    depends_on:
      api-backend:
        condition: service_healthy
      site-worker-orchestrator:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "borealis-job-scheduler-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  site-worker-orchestrator:
    <<: *borealis-hardened-service
    image: ${BOREALIS_JOB_SCHEDULER_IMAGE:-borealis-engine/job-scheduler:local}
    container_name: borealis-engine-site-worker-orchestrator
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    group_add:
      - "${BOREALIS_DOCKER_SOCKET_GID:-0}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_SITE_WORKER_ORCHESTRATOR_MEMORY_LIMIT:-256m}
    cpus: "${BOREALIS_SITE_WORKER_ORCHESTRATOR_CPU_LIMIT:-1.00}"
    pids_limit: ${BOREALIS_SITE_WORKER_ORCHESTRATOR_PIDS_LIMIT:-160}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    environment:
      BOREALIS_PROCESS_ROLE: site-worker-orchestrator
      BOREALIS_INTERNAL_API_BASE_URL: ${BOREALIS_INTERNAL_API_BASE_URL:-http://127.0.0.1:5000}
      BOREALIS_SITE_WORKER_IMAGE: ${BOREALIS_SITE_WORKER_IMAGE:-borealis-engine/site-worker:local}
      BOREALIS_SITE_WORKER_ORCHESTRATOR_SOCKET: ${BOREALIS_SITE_WORKER_ORCHESTRATOR_SOCKET:-/opt/Borealis/Engine/Services/site-worker-orchestrator/run/orchestrator.sock}
      HOME: /tmp
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Deploy:/opt/Borealis/Engine/Deploy:ro
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/api-backend:/opt/Borealis/Engine/Services/api-backend
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/site-worker-orchestrator:/opt/Borealis/Engine/Services/site-worker-orchestrator
      - ${BOREALIS_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      api-backend:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "borealis-site-worker-orchestrator-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  webui-frontend:
    <<: *borealis-hardened-service
    image: ${BOREALIS_WEBUI_FRONTEND_IMAGE:-borealis-engine/webui-frontend:local}
    container_name: borealis-engine-webui-frontend
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_WEBUI_FRONTEND_MEMORY_LIMIT:-256m}
    cpus: "${BOREALIS_WEBUI_FRONTEND_CPU_LIMIT:-0.50}"
    pids_limit: ${BOREALIS_WEBUI_FRONTEND_PIDS_LIMIT:-128}
    env_file:
      - ${BOREALIS_WEBUI_ENV_FILE:-compose.env.example}
    environment:
      BOREALIS_WEBUI_VITE_CACHE_DIR: /tmp/borealis-vite-cache
      HOME: /tmp
    volumes:
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/src:/opt/Borealis/Data/Engine/web-interface/src
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/public:/opt/Borealis/Data/Engine/web-interface/public
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/Unit_Tests:/opt/Borealis/Data/Engine/web-interface/Unit_Tests
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/index.html:/opt/Borealis/Data/Engine/web-interface/index.html
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/package.json:/opt/Borealis/Data/Engine/web-interface/package.json
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/tsconfig.json:/opt/Borealis/Data/Engine/web-interface/tsconfig.json
      - ${BOREALIS_WEBUI_RUNTIME_SOURCE_DIR:-/opt/Borealis/Engine/Services/webui-frontend/data/web-interface}/vite.config.mts:/opt/Borealis/Data/Engine/web-interface/vite.config.mts
    healthcheck:
      test: ["CMD", "borealis-webui-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  traefik-edge:
    <<: *borealis-hardened-service
    image: ${BOREALIS_TRAEFIK_EDGE_IMAGE:-borealis-engine/traefik-edge:local}
    container_name: borealis-engine-traefik-edge
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: ${BOREALIS_TRAEFIK_EDGE_MEMORY_LIMIT:-256m}
    cpus: "${BOREALIS_TRAEFIK_EDGE_CPU_LIMIT:-1.00}"
    pids_limit: ${BOREALIS_TRAEFIK_EDGE_PIDS_LIMIT:-128}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    environment:
      HOME: /tmp
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/traefik-edge:/opt/Borealis/Engine/Services/traefik-edge
    depends_on:
      api-backend:
        condition: service_healthy
      webui-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping=true --ping.entryPoint=borealis-health --entryPoints.borealis-health.address=127.0.0.1:$${BOREALIS_TRAEFIK_HEALTH_PORT:-8082}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-db:
    <<: *borealis-hardened-service
    image: ${BOREALIS_POSTGRES_DB_IMAGE:-borealis-engine/postgres-db:local}
    container_name: borealis-engine-postgres-db
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_POSTGRES_DB_MEMORY_LIMIT:-1536m}
    cpus: "${BOREALIS_POSTGRES_DB_CPU_LIMIT:-1.50}"
    pids_limit: ${BOREALIS_POSTGRES_DB_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646},gid=${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646},mode=0775
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=5432
      - -c
      - max_connections=${BOREALIS_POSTGRES_MAX_CONNECTIONS:-80}
      - -c
      - shared_buffers=${BOREALIS_POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${BOREALIS_POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${BOREALIS_POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${BOREALIS_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_worker_processes=${BOREALIS_POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${BOREALIS_POSTGRES_MAX_PARALLEL_WORKERS:-8}
      - -c
      - max_parallel_workers_per_gather=${BOREALIS_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - autovacuum_max_workers=${BOREALIS_POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}
      - -c
      - autovacuum_vacuum_cost_limit=${BOREALIS_POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-1000}
      - -c
      - autovacuum_naptime=${BOREALIS_POSTGRES_AUTOVACUUM_NAPTIME:-30s}
      - -c
      - autovacuum_vacuum_scale_factor=${BOREALIS_POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.02}
      - -c
      - autovacuum_analyze_scale_factor=${BOREALIS_POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.01}
      - -c
      - max_wal_size=${BOREALIS_POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - min_wal_size=${BOREALIS_POSTGRES_MIN_WAL_SIZE:-512MB}
      - -c
      - effective_io_concurrency=${BOREALIS_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-16}
      - -c
      - wal_compression=${BOREALIS_POSTGRES_WAL_COMPRESSION:-on}
      - -c
      - checkpoint_timeout=${BOREALIS_POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - checkpoint_completion_target=${BOREALIS_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - random_page_cost=${BOREALIS_POSTGRES_RANDOM_PAGE_COST:-1.1}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/postgres-db/state:/var/lib/postgresql/data
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/postgres-db/logs:/var/log/postgresql
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/postgres-db/run:/var/run/borealis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER:-borealis}\" -d \"$${POSTGRES_DB:-borealis}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  remote-desktop-guacd:
    <<: *borealis-hardened-service
    image: ${BOREALIS_REMOTE_DESKTOP_GUACD_IMAGE:-borealis-engine/remote-desktop-guacd:local}
    container_name: borealis-engine-remote-desktop-guacd
    network_mode: host
    user: "${BOREALIS_ENGINE_RUNTIME_OWNER_UID:-64646}:${BOREALIS_ENGINE_RUNTIME_OWNER_GID:-64646}"
    restart: unless-stopped
    mem_limit: ${BOREALIS_REMOTE_DESKTOP_GUACD_MEMORY_LIMIT:-256m}
    cpus: "${BOREALIS_REMOTE_DESKTOP_GUACD_CPU_LIMIT:-1.00}"
    pids_limit: ${BOREALIS_REMOTE_DESKTOP_GUACD_PIDS_LIMIT:-64}
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    environment:
      HOME: /tmp
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/remote-desktop-guacd/logs:/opt/borealis/logs
    healthcheck:
      test: ["CMD", "borealis-guacd-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  wireguard-tunnel:
    <<: *borealis-hardened-service
    image: ${BOREALIS_WIREGUARD_TUNNEL_IMAGE:-borealis-engine/wireguard-tunnel:local}
    container_name: borealis-engine-wireguard-tunnel
    network_mode: host
    user: "0:0"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    mem_limit: ${BOREALIS_WIREGUARD_TUNNEL_MEMORY_LIMIT:-128m}
    cpus: "${BOREALIS_WIREGUARD_TUNNEL_CPU_LIMIT:-1.00}"
    pids_limit: ${BOREALIS_WIREGUARD_TUNNEL_PIDS_LIMIT:-64}
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ${BOREALIS_RUNTIME_ENV_FILE:-compose.env.example}
    volumes:
      - ${BOREALIS_PROJECT_ROOT:-/opt/Borealis}/Engine/Services/wireguard-tunnel:/opt/Borealis/Engine/Services/wireguard-tunnel
    healthcheck:
      test: ["CMD", "borealis-wireguard-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 2s
