apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: borealis-wireguard-routes
  namespace: borealis
  labels: {app.kubernetes.io/name: borealis-wireguard-routes, app.kubernetes.io/part-of: borealis}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: borealis-wireguard-routes}}
  template:
    metadata: {labels: {app.kubernetes.io/name: borealis-wireguard-routes, app.kubernetes.io/part-of: borealis}}
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 20
      nodeSelector: {borealis.io/engine-node: "true"}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: route-reconciler
          image: borealis-engine/wireguard-tunnel:sha-000000000000
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/borealis-wireguard-route-daemon"]
          args: ["serve"]
          envFrom:
            - secretRef: {name: borealis-wireguard-tunnel-runtime-env}
          startupProbe:
            exec: {command: ["/usr/local/bin/borealis-wireguard-route-daemon", "health"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["/usr/local/bin/borealis-wireguard-route-daemon", "health"]}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec: {command: ["/usr/local/bin/borealis-wireguard-route-daemon", "live"]}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["/usr/local/bin/borealis-wireguard-route-daemon", "withdraw"]}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {add: ["NET_ADMIN"], drop: ["ALL"]}
