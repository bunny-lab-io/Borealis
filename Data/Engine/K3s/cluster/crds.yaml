apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: borealisclusteroperations.engine.borealis.io
spec:
  group: engine.borealis.io
  scope: Namespaced
  names:
    plural: borealisclusteroperations
    singular: borealisclusteroperation
    kind: BorealisClusterOperation
    shortNames: [bcop]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Step
          type: string
          jsonPath: .spec.step
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [operationID, kind, step]
              properties:
                operationID: {type: string, format: uuid}
                kind: {type: string, maxLength: 64}
                step: {type: string, maxLength: 128}
                targetNodeID: {type: string, format: uuid}
                targetRelease: {type: string, maxLength: 32}
                targetSHA: {type: string, pattern: '^[0-9a-f]{40}$'}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
