apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: borealisclusters.engine.borealis.io
spec:
  group: engine.borealis.io
  scope: Namespaced
  names:
    plural: borealisclusters
    singular: borealiscluster
    kind: BorealisCluster
    shortNames: [bcluster]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [activeSize, clusterVIP]
              properties:
                activeSize: {type: integer, enum: [1, 2, 3]}
                desiredSize: {type: integer, enum: [1, 3]}
                clusterVIP: {type: string, format: ipv4}
                baselineRelease: {type: string, maxLength: 32, pattern: '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+(?:\.[0-9]+)?$'}
                baselineSHA: {type: string, pattern: '^[0-9a-f]{40}$'}
                hmrNodeID: {type: string, format: uuid}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
