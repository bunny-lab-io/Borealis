apiVersion: v1
kind: ServiceAccount
metadata:
  name: borealis-cluster-controller
  namespace: borealis
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: borealis-cluster-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["borealis-cluster-vip"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["upgrade.cattle.io"]
    resources: ["plans"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["longhorn.io"]
    resources: ["replicas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["engine.borealis.io"]
    resources: ["borealisclusters", "borealisnodeadmissions", "borealisnoderuntimes", "borealisclusteroperations"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["engine.borealis.io"]
    resources: ["borealisclusters/status", "borealisnodeadmissions/status", "borealisnoderuntimes/status", "borealisclusteroperations/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: borealis-cluster-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: borealis-cluster-controller
subjects:
  - kind: ServiceAccount
    name: borealis-cluster-controller
    namespace: borealis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: borealis-cluster-controller
  namespace: borealis
  labels:
    app.kubernetes.io/name: borealis-cluster-controller
    app.kubernetes.io/part-of: borealis
spec:
  replicas: 2
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: borealis-cluster-controller}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: borealis-cluster-controller
        app.kubernetes.io/part-of: borealis
    spec:
      serviceAccountName: borealis-cluster-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: borealis-cluster-controller}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: borealis-cluster-controller}
      containers:
        - name: controller
          image: borealis-engine/api-backend:sha-000000000000
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/borealis-cluster-controller"]
          env:
            - {name: BOREALIS_PROCESS_ROLE, value: borealis-cluster-controller}
            - {name: BOREALIS_CLUSTER_CONTROLLER_PORT, value: "8090"}
            - name: BOREALIS_CLUSTER_CONTROLLER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: BOREALIS_CLUSTER_ACTION_IMAGE, value: borealis-engine/api-backend:sha-000000000000}
          envFrom:
            - secretRef: {name: borealis-api-backend-runtime-env}
          ports:
            - {name: health, containerPort: 8090}
          startupProbe:
            httpGet: {path: /startup, port: health}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: health}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /live, port: health}
            initialDelaySeconds: 70
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 5"]}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 64646
            runAsGroup: 64646
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: borealis-cluster-controller
  namespace: borealis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: borealis-cluster-controller}
