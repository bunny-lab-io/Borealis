[project]
site_name = "Borealis Documentation"
site_description = "Borealis operator, runtime, API, and contributor documentation."
site_author = "Bunny Lab"
site_url = "https://bunny-lab-io.github.io/Borealis/"
repo_url = "https://github.com/bunny-lab-io/Borealis"
repo_name = "bunny-lab-io/Borealis"
edit_uri = "edit/main/Docs/"
docs_dir = "Docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 Bunny Lab"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Start Here" = [
    { "Overview" = "Start Here/index.md" },
    "Start Here/getting-started.md",
    "Start Here/architecture-overview.md",
    "Start Here/security-and-trust.md",
    "Start Here/ui-and-notifications.md",
    "Start Here/screenshots.md",
  ] },
  { "Operations" = [
    { "Overview" = "Operations and Remote Access/index.md" },
    "Operations and Remote Access/device-management.md",
    "Operations and Remote Access/device-alerts.md",
    "Operations and Remote Access/vpn-and-remote-access.md",
    "Operations and Remote Access/logging-and-operations.md",
    { "Software Management" = [
      { "Overview" = "Software Management/index.md" },
      "Software Management/adding-software-to-icon-overrides.md",
      "Software Management/adding-software-to-uninstall-blocklist.md",
      "Software Management/adding-software-to-uninstall-overrides.md",
    ] },
  ] },
  { "Automation" = [
    { "Overview" = "Automation and Execution/index.md" },
    "Automation and Execution/assemblies.md",
    "Automation and Execution/flow-editor-and-nodes.md",
    "Automation and Execution/scheduled-jobs.md",
    "Automation and Execution/SSH_Connection_Logic.md",
    "Automation and Execution/watchdogs.md",
  ] },
  { "Reference" = [
    { "Core Runtimes" = [
      { "Overview" = "Core Runtimes/index.md" },
      "Core Runtimes/engine-runtime.md",
      "Core Runtimes/agent-runtime.md",
      "Core Runtimes/Stack_Breakdown.md",
    ] },
    { "Data and Schema" = [
      { "Overview" = "Data and Schema/index.md" },
      "Data and Schema/db-reference.md",
      "Data and Schema/api-reference.md",
      "Data and Schema/integrations.md",
      "SBOM.md",
    ] },
  ] },
  { "Development" = [
    "Start Here/Unit_Testing.md",
    "Start Here/testing.md",
    "Start Here/testing-regressions.md",
    { "Migration Paths" = [
      { "Overview" = "Migration Paths/index.md" },
      "Migration Paths/migrating-pages-to-react-router.md",
    ] },
  ] },
  { "Roadmap" = [
    { "Overview" = "Future_Roadmaps/index.md" },
    "Future_Roadmaps/competitive-feature-gap-analysis.md",
  ] },
]

[project.theme]
variant = "classic"
language = "en"
logo = "Branding/Borealis_Logo_Full.png"
favicon = "Branding/Borealis_Logo.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bunny-lab-io/Borealis"
name = "Borealis on GitHub"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
