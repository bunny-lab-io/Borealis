name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_ADMIN_TOKEN != '' && secrets.PAGES_ADMIN_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}

      - name: Prepare site
        run: |
          mkdir -p site
          cp -R Docs/website/. site/
          mkdir -p site/Branding site/repo_screenshots
          cp -R Docs/Branding/. site/Branding/
          cp -R Docs/images/repo_screenshots/. site/repo_screenshots/
          VERSION="$(git rev-parse --short HEAD)"
          sed -i "s/__BOREALIS_BUILD_VERSION__/${VERSION}/g" site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
