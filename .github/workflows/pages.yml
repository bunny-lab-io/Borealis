name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Docs/**"
      - "zensical.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build documentation
        run: ./Tests/run-docs.sh

      - name: Prune Pages artifact
        run: |
          find site -type f \( \
            -iname '*.psd' -o \
            -iname '*.psb' -o \
            -iname '*.xcf' -o \
            -iname '*.ai' -o \
            -iname '*.sketch' \
          \) -delete
          du -sh site
          find site -type f -printf '%s\t%p\n' | sort -nr | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        timeout-minutes: 5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
