version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/Data/Agent"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      agent-go-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      agent-go-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      agent-go-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "gomod"
    directory: "/Data/Engine/Containers/api-backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:30"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      engine-go-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      engine-go-passkey-sensitive:
        applies-to: "version-updates"
        patterns:
          - "github.com/go-webauthn/webauthn"
        update-types:
          - "minor"
          - "patch"
      engine-go-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/go-webauthn/webauthn"
        update-types:
          - "minor"
          - "patch"
      engine-go-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directory: "/Data/Engine/Containers/site-worker/data"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/Data/Engine/Containers/webui-frontend/data/web-interface"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "04:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      webui-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      webui-production-minor-patch:
        dependency-type: "production"
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      webui-development-minor-patch:
        dependency-type: "development"
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/Data/Engine/Containers/api-backend"
      - "/Data/Engine/Containers/borealis-operator"
      - "/Data/Engine/Containers/job-scheduler"
      - "/Data/Engine/Containers/postgres-db"
      - "/Data/Engine/Containers/remote-desktop-guacd"
      - "/Data/Engine/Containers/site-worker"
      - "/Data/Engine/Containers/traefik-edge"
      - "/Data/Engine/Containers/webui-frontend"
      - "/Data/Engine/Containers/wireguard-tunnel"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "04:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      engine-container-base-images:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
