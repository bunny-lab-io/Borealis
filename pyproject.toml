[tool.pytest.ini_options]
testpaths = [
  "Data/Engine/Unit_Tests",
  "Data/Agent/Unit_Tests",
]
addopts = "-ra --strict-markers -p no:cacheprovider"
norecursedirs = [
  ".git",
  ".pytest_cache",
  "Agent",
  "Dependencies",
  "Engine",
  "Temp",
  "Update_Staging",
  "__pycache__",
]
markers = [
  "engine: Engine unit tests",
  "agent: Agent unit tests",
  "webui: WebUI unit tests",
  "regression: regression coverage for a previously observed bug",
  "slow: slower unit test retained in the default full-runtime lane",
]
